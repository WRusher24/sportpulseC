name: Scheduled refresh (every 5 minutes)

# Vercel Hobby only allows daily cron jobs. GitHub Actions can call the maintenance endpoint every 5 minutes for free.
# Setup: repository Settings -> Secrets and variables -> Actions -> add APP_URL (https://your-app.vercel.app) and CRON_SECRET.
# Without APP_URL this workflow exits successfully and does nothing.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/ingest
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL secret not set - skipping"; exit 0; fi
          curl -fsS -m 150 --retry 2 -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL%/}/api/cron/ingest" | head -c 1500
